server:
  port: ${JOB_SERVER_PORT}
  tomcat:
    threads:
      max: 10

spring:
  application:
    name: job-service

logging:
  level:
    root: INFO
    org.mongodb.driver: WARN
    org.springframework.data.mongodb: WARN

job:
  mongodb:
    uri: ${JOB_MONGO_URI}
    database: ${JOB_MONGO_DATABASE}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}