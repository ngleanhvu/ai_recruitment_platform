services:
  mongodb:
    image: mongo:7.0
    container_name: job-mongodb
    restart: always
    ports:
      - "27016:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: job_db
    volumes:
      - ./data/mongodb_data:/data/db

volumes:
  mongodb_data: