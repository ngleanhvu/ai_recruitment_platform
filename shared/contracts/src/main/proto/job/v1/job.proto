syntax = "proto3";

option java_package = "com.ngleanhvu.grpc.job.v1";
option java_multiple_files = true;

service JobService {
  rpc ExistsJobById(ExistsJobByIdRequest)
      returns (ExistsJobByIdResponse);
}

message ExistsJobByIdRequest {
  string job_id = 1;
}

message ExistsJobByIdResponse {
  bool exists = 1;
}