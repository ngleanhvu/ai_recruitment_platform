syntax = "proto3";

option java_package = "com.ngleanhvu.grpc.resume.v1";
option java_multiple_files = true;

service ResumeService {
  rpc ExistsResumeByIdAndCandidateId(ExistsResumeByIdAndCandidateIdRequest)
      returns (ExistsResumeByIdAndCandidateIdResponse);
}

message ExistsResumeByIdAndCandidateIdRequest {
  string resume_id = 1;
  string candidate_id = 2;
}

message ExistsResumeByIdAndCandidateIdResponse {
  bool exists = 1;
}