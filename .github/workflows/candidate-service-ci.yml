name: Candidate Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'candidate-service/**'
      - '.github/workflows/candidate-service-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'candidate-service/**'
      - '.github/workflows/candidate-service-ci.yml'

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: candidate-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
          cache-dependency-path: candidate-service/pom.xml

      - name: Check formatting
        run: mvn spotless:check

      - name: Run tests
        run: mvn clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: candidate-service/target/site/jacoco/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: candidate-service/target/surefire-reports/
          if-no-files-found: warn