name: Candidate Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'candidate-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'candidate-service/**'

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: candidate-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
          cache-dependency-path: candidate-service/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests, JaCoCo and Spotless
        run: ./mvnw clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: candidate-service/target/site/jacoco/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: candidate-service/target/surefire-reports/